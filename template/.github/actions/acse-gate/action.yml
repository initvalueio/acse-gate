# ACSE gate: the composite action the policy repository's acse-gate.yml runs. Everything the gate does is here.
#
# It evaluates one Terraform plan (terraform show -json) with plain, pinned opa against the policy bundle that GitHub
# fetched together with this action (bundles/current in the same repository), annotates the pull request, and sends
# a verdict-only report. Where the report goes (tenant, OIDC audience, report URL) is read from .github/acse-gate.json
# in the same repository (gate-config-1.0); no caller passes it. Nothing in it needs ACSE to be reachable: the report
# is the only call to ACSE, and its failure never changes the job's outcome. The job fails only when a class in
# enforce mode fails.
#
# Two ways in. The reusable workflow passes plan-artifact: the action then checks out the code under review and
# downloads the plan from that artifact of the same run. Without plan-artifact it reads plan-json (and tfvars-json)
# from paths in a workspace the caller has already checked out.
#
# Part of the gate template (acse-gate-template-1 covers this directory and .github/workflows/acse-gate.yml; not
# .github/acse-gate.json). An edited copy still gates, but ACSE refuses its reports.
name: ACSE gate
description: Evaluate a Terraform plan against the policy bundle in this repository with pinned OPA, and report the verdict.
inputs:
  plan-artifact:
    description: Name of an artifact of this run that holds the plan JSON. When set, the action also checks out the code under review.
    required: false
    default: ""
  plan-file:
    description: With plan-artifact, the plan JSON's path inside the artifact.
    required: false
    default: plan.json
  tfvars-file:
    description: With plan-artifact, the optional variables JSON's path inside the artifact.
    required: false
    default: ""
  plan-json:
    description: Without plan-artifact, the path to the plan as JSON (terraform show -json), relative to the workspace or absolute.
    required: false
    default: ""
  tfvars-json:
    description: Without plan-artifact, the optional path to the variables as JSON, used only to name a resource's project.
    required: false
    default: ""
  working-directory:
    description: The Terraform root the plan was made in, relative to the workspace. Used to find file and line.
    required: false
    default: "."
  github-token:
    description: Used only to post suggested changes on the pull request, when the job grants pull-requests write.
    required: false
    default: ${{ github.token }}
  opa-path:
    description: Optional path to an opa binary already on the runner. It must match the pinned checksum.
    required: false
    default: ""
outputs:
  verdict:
    description: pass, fail or error.
    value: ${{ steps.evaluate.outputs.verdict }}
  report-state:
    description: What happened to the report (counted, held, pending, refused, undelivered, skipped).
    value: ${{ steps.report.outputs.state }}
runs:
  using: composite
  steps:
    - name: Check out the code under review
      if: inputs.plan-artifact != ''
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Fetch the plan
      if: inputs.plan-artifact != ''
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ${{ inputs.plan-artifact }}
        path: ${{ runner.temp }}/acse-gate-input

    - id: evaluate
      name: Evaluate the plan
      shell: bash
      env:
        ACSE_GATE_ACTION_DIR: ${{ github.action_path }}
        ACSE_GATE_PLAN: ${{ inputs.plan-artifact != '' && format('{0}/acse-gate-input/{1}', runner.temp, inputs.plan-file) || inputs.plan-json }}
        ACSE_GATE_TFVARS: ${{ inputs.plan-artifact != '' && inputs.tfvars-file != '' && format('{0}/acse-gate-input/{1}', runner.temp, inputs.tfvars-file) || inputs.tfvars-json }}
        ACSE_GATE_WORKDIR: ${{ inputs.working-directory }}
        ACSE_GATE_OPA_PATH: ${{ inputs.opa-path }}
      run: bash "$ACSE_GATE_ACTION_DIR/gate.sh" evaluate

    - id: annotate
      name: Annotate the pull request
      if: always()
      shell: bash
      env:
        ACSE_GATE_ACTION_DIR: ${{ github.action_path }}
        ACSE_GATE_PLAN: ${{ inputs.plan-artifact != '' && format('{0}/acse-gate-input/{1}', runner.temp, inputs.plan-file) || inputs.plan-json }}
        ACSE_GATE_WORKDIR: ${{ inputs.working-directory }}
        ACSE_GATE_GITHUB_TOKEN: ${{ inputs.github-token }}
      run: bash "$ACSE_GATE_ACTION_DIR/gate.sh" annotate || echo "::warning title=ACSE gate::annotations could not be completed"

    - id: report
      name: Report the verdict
      if: always()
      shell: bash
      env:
        ACSE_GATE_ACTION_DIR: ${{ github.action_path }}
        ACSE_GATE_CHECK_RUN_ID: ${{ job.check_run_id }}
      run: bash "$ACSE_GATE_ACTION_DIR/gate.sh" report || echo "::warning title=ACSE gate::the report was not delivered"

    - id: decide
      name: Decide the job's outcome
      if: always()
      shell: bash
      env:
        ACSE_GATE_ACTION_DIR: ${{ github.action_path }}
      run: bash "$ACSE_GATE_ACTION_DIR/gate.sh" decide
