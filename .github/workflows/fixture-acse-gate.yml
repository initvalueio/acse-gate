# ACSE gate: the thin reusable workflow your IaC repositories call.
#
#   jobs:
#     acse-gate:
#       needs: plan                      # the job that uploaded the plan as the artifact acse-gate-plan
#       permissions:
#         contents: read
#         id-token: write                # the verdict-only report (no secret)
#         pull-requests: write           # optional: suggested changes as review comments
#       uses: <org>/<policy-repo>/.github/workflows/acse-gate.yml@main
#
# That is the whole caller, the same in every repository: it carries no audience, tenant id or report URL. Where the
# verdict goes is read at run time from .github/acse-gate.json in this policy repository (gate-config-1.0, generated
# by your ACSE setup apply). Without that file the gate still gates and sends no report.
#
# It needs no credential. GitHub fetches this workflow, the composite action, its config and the policy bundle beside
# them through this repository's "Accessible from repositories in the organization" Actions setting. Strictness lives
# in the bundle (bundles/<name>/bundle.json), never here.
#
# This file is a shell: one job that runs the composite action. Everything the gate does is in
# .github/actions/acse-gate/, so a new release normally changes only the action, which ACSE proposes by pull request.
# ACSE never writes this file: when a release does change it, ACSE shows you the new file, its digest and why, and you
# apply it. Part of the gate template (acse-gate-template-1): an edited copy still gates, but ACSE refuses its reports.
name: acse-gate

on:
  workflow_call:
    inputs:
      plan-artifact:
        description: Name of the artifact, uploaded earlier in this run, that holds the plan JSON.
        type: string
        default: acse-gate-plan
      plan-file:
        description: The plan JSON's path inside the artifact (terraform show -json of the plan).
        type: string
        default: plan.json
      tfvars-file:
        description: Optional variables JSON's path inside the artifact.
        type: string
        default: ""
      working-directory:
        description: The Terraform root the plan was made in, relative to the repository root.
        type: string
        default: "."
      runs-on:
        description: The runner label (linux, x64).
        type: string
        default: ubuntu-latest
    outputs:
      verdict:
        description: pass, fail or error.
        value: ${{ jobs.gate.outputs.verdict }}

jobs:
  gate:
    name: ACSE gate
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 15
    outputs:
      verdict: ${{ steps.gate.outputs.verdict }}
    steps:
      - name: Check out this repository (fixture only, so that the local composite action below can be found)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Gate
        id: gate
        uses: ./fixtures/policy-repo/.github/actions/acse-gate
        with:
          plan-artifact: ${{ inputs.plan-artifact }}
          plan-file: ${{ inputs.plan-file }}
          tfvars-file: ${{ inputs.tfvars-file }}
          working-directory: ${{ inputs.working-directory }}
